id: stacking_cups
name: 神奇的纸杯搭建
age: 中班
description: 用纸杯进行简单的搭建和创造，观察纸杯的形状、稳定性和摆放方式。
goals:
  - 认识纸杯的形状和结构特点
  - 尝试把纸杯稳定地搭起来
  - 鼓励儿童自主创造不同的搭建方式
materials:
  - 纸杯
steps:
  - id: 1
    title: 认识纸杯
    instruction: 先拿一个纸杯观察一下，看看它是什么形状，哪里宽，哪里窄。
    goal: 认识纸杯的基本形状和结构。
    tips:
      - 让孩子先自己观察，不要马上告诉答案。
    common_questions:
      - question: 纸杯是什么形状？
        answer: 纸杯看起来像一个上面比较宽、下面比较窄的形状。

  - id: 2
    title: 把第一个纸杯放稳
    instruction: 把第一个纸杯放在平整的地方，让它先站稳。
    goal: 为后面的搭建打好稳定的基础。
    tips:
      - 如果纸杯摇晃，可以换一个更平整的位置。

  - id: 3
    title: 继续搭建
    instruction: 拿起第二个纸杯，轻轻地放到合适的位置，看看它能不能稳稳地站住。
    goal: 尝试控制纸杯的位置和力度。
    tips:
      - 动作轻一点，观察纸杯有没有晃动。

  - id: 4
    title: 检查搭建结果
    instruction: 看看搭好的纸杯是不是稳定，如果容易倒，可以调整下面的纸杯。
    goal: 观察搭建结果并尝试调整。
    tips:
      - 鼓励孩子自己发现哪里不稳定。

safety:
  - 不要把纸杯放入口中。
  - 搭建时不要把纸杯用力扔向别人。
  - 如果纸杯倒了，可以重新搭，不需要责怪孩子。

common_questions:
  - question: 纸杯为什么会倒？
    answer: 可能是下面没有放稳，或者上面的纸杯没有放在合适的位置。我们可以先把下面放平，再试一次。
  - question: 可以搭得更高吗？
    answer: 可以试试看，不过要先让下面的部分稳稳的，再一点一点往上搭。
  - question: 我搭失败了怎么办？
    answer: 没关系，我们可以看看是哪一个地方不稳，再一起试一次。
